# DATABASE
spring:
  config:
    activate:
      on-profile: local

  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      format_sql: true
      show_sql: true  # 콘솔에서 실행된 SQL 확인

  sql:
    init:
      mode: always  # 애플리케이션 시작 시 SQL 초기화 항상 실행
      schema-locations: classpath:sql/schema.sql